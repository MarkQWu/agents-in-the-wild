name: Sync Upstream

on:
  schedule:
    # Sunday 23:00 UTC = Monday 07:00 Beijing
    - cron: '0 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Try GitHub native sync first
        id: native
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESP=$(gh api -X POST repos/${{ github.repository }}/merge-upstream \
            -f branch=main 2>&1) || true
          echo "Response: $RESP"
          if echo "$RESP" | grep -q "merge_type"; then
            echo "result=fast-forward" >> "$GITHUB_OUTPUT"
            echo "✓ Native sync succeeded"
          else
            echo "result=diverged" >> "$GITHUB_OUTPUT"
            echo "✗ Cannot fast-forward — falling back to merge"
          fi

      - name: Manual merge if diverged
        if: steps.native.outputs.result == 'diverged'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/xiaolai/nlpm-for-claude.git
          git fetch upstream main
          git merge upstream/main --no-edit --no-ff \
            -m "sync: merge upstream xiaolai/nlpm-for-claude" || {
            git checkout --ours case-studies/ learning-digest/ 2>/dev/null || true
            git checkout --theirs . 2>/dev/null || true
            git add -A
            git commit --no-edit
          }
          git push origin main

      - name: Refresh upstream-slugs manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pull -latest after the merge
          git pull --no-rebase origin main 2>/dev/null || true

          # List all audit reports currently in upstream (primary .md only, no re-audit/findings)
          gh api repos/xiaolai/nlpm-for-claude/contents/auditor/audits \
            --jq '[.[] | select(.name | endswith(".md")) | select(.name | contains("re-audit") | not) | .name | sub("\\.md$"; "")] | .[]' \
            2>/dev/null | sort -u > auditor/audits/.upstream-slugs.txt

          COUNT=$(wc -l < auditor/audits/.upstream-slugs.txt | tr -d ' ')
          echo "Upstream slugs tracked: $COUNT"

          # Commit if changed
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auditor/audits/.upstream-slugs.txt
          if ! git diff --cached --quiet; then
            git commit -m "sync: refresh upstream-slugs manifest ($COUNT slugs)"
            git push origin main
          else
            echo "No changes to manifest"
          fi

      - name: Report new audits this sync
        run: |
          NEW=$(git diff --name-only --diff-filter=A HEAD~3 HEAD -- 'auditor/audits/*.md' 2>/dev/null | grep -v re-audit | grep -v findings | wc -l | tr -d ' ')
          echo "## Sync summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- New audit reports: $NEW" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream manifest: \`auditor/audits/.upstream-slugs.txt\`" >> "$GITHUB_STEP_SUMMARY"
